<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="双波干涉">
  <rect width="1600" height="1200" fill="#11111b"/>
  <defs>
    <g id="ringsA">
      <circle cx="450" cy="600" r="60"  fill="none" stroke="#89b4fa" stroke-width="4"/>
      <circle cx="450" cy="600" r="140" fill="none" stroke="#89b4fa" stroke-width="4" opacity="0.8"/>
      <circle cx="450" cy="600" r="220" fill="none" stroke="#89b4fa" stroke-width="4" opacity="0.6"/>
      <circle cx="450" cy="600" r="300" fill="none" stroke="#89b4fa" stroke-width="4" opacity="0.45"/>
      <circle cx="450" cy="600" r="380" fill="none" stroke="#89b4fa" stroke-width="4" opacity="0.3"/>
      <circle cx="450" cy="600" r="460" fill="none" stroke="#89b4fa" stroke-width="4" opacity="0.18"/>
    </g>
    <g id="ringsB">
      <circle cx="1150" cy="600" r="60"  fill="none" stroke="#f5c2e7" stroke-width="4"/>
      <circle cx="1150" cy="600" r="140" fill="none" stroke="#f5c2e7" stroke-width="4" opacity="0.8"/>
      <circle cx="1150" cy="600" r="220" fill="none" stroke="#f5c2e7" stroke-width="4" opacity="0.6"/>
      <circle cx="1150" cy="600" r="300" fill="none" stroke="#f5c2e7" stroke-width="4" opacity="0.45"/>
      <circle cx="1150" cy="600" r="380" fill="none" stroke="#f5c2e7" stroke-width="4" opacity="0.3"/>
      <circle cx="1150" cy="600" r="460" fill="none" stroke="#f5c2e7" stroke-width="4" opacity="0.18"/>
    </g>
  </defs>
  <use href="#ringsA"/>
  <use href="#ringsB" style="mix-blend-mode: screen"/>
  <g fill="#f9e2af">
    <circle cx="450" cy="600" r="14"/>
    <circle cx="1150" cy="600" r="14"/>
  </g>
  <text x="450" y="530" text-anchor="middle" font-family="monospace" font-size="34" fill="#89b4fa">S1</text>
  <text x="1150" y="530" text-anchor="middle" font-family="monospace" font-size="34" fill="#f5c2e7">S2</text>
  <g fill="none" stroke="#a6e3a1" stroke-width="3" stroke-dasharray="10 10">
    <line x1="800" y1="140" x2="800" y2="1060"/>
  </g>
  <text x="820" y="180" font-family="monospace" font-size="26" fill="#a6e3a1">d = 0 (相长干涉)</text>
  <text x="1120" y="1120" font-family="monospace" font-size="24" fill="#7f849c">|r1 - r2| = nλ → 亮纹</text>
</svg>
