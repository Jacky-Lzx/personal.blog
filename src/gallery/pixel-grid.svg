  </g>
  <text x="160" y="150" font-family="monospace" font-size="44" fill="#cdd6f4">01001000 01101001</text>
  <text x="160" y="1130" font-family="monospace" font-size="28" fill="#7f849c"># 点亮一个格子，就是一个比特</text>
