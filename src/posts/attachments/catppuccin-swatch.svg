<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-label="配色卡">
  <rect width="1600" height="1200" fill="#11111b"/>
  <text x="80" y="120" font-family="monospace" font-size="48" fill="#cdd6f4">Catppuccin Mocha</text>
  <text x="80" y="170" font-family="monospace" font-size="28" fill="#7f849c"># 博客双主题的调色板</text>
  <g font-family="monospace" font-size="26">
    <!-- row 1 -->
    <rect x="80"  y="240" width="280" height="160" rx="14" fill="#1e1e2e" stroke="#45475a"/>
    <rect x="380" y="240" width="280" height="160" rx="14" fill="#181825" stroke="#45475a"/>
    <rect x="680" y="240" width="280" height="160" rx="14" fill="#11111b" stroke="#45475a"/>
    <rect x="980" y="240" width="280" height="160" rx="14" fill="#313244" stroke="#45475a"/>
    <rect x="1280" y="240" width="280" height="160" rx="14" fill="#45475a" stroke="#585b70"/>
    <!-- row 2 -->
    <rect x="80"  y="440" width="280" height="160" rx="14" fill="#cba6f7"/>
    <rect x="380" y="440" width="280" height="160" rx="14" fill="#f38ba8"/>
    <rect x="680" y="440" width="280" height="160" rx="14" fill="#fab387"/>
    <rect x="980" y="440" width="280" height="160" rx="14" fill="#f9e2af"/>
    <rect x="1280" y="440" width="280" height="160" rx="14" fill="#a6e3a1"/>
    <!-- row 3 -->
    <rect x="80"  y="640" width="280" height="160" rx="14" fill="#94e2d5"/>
    <rect x="380" y="640" width="280" height="160" rx="14" fill="#89dceb"/>
    <rect x="680" y="640" width="280" height="160" rx="14" fill="#89b4fa"/>
    <rect x="980" y="640" width="280" height="160" rx="14" fill="#b4befe"/>
    <rect x="1280" y="640" width="280" height="160" rx="14" fill="#f5c2e7"/>
  </g>
  <g font-family="monospace" font-size="24" fill="#11111b">
    <text x="100" y="555">mauve</text>
    <text x="400" y="555">red</text>
    <text x="700" y="555">peach</text>
    <text x="1000" y="555">yellow</text>
    <text x="1300" y="555">green</text>
    <text x="100" y="755">teal</text>
    <text x="400" y="755">sky</text>
    <text x="700" y="755">blue</text>
    <text x="1000" y="755">lavender</text>
    <text x="1300" y="755">pink</text>
  </g>
  <g font-family="monospace" font-size="24" fill="#cdd6f4">
    <text x="100" y="370">base</text>
    <text x="400" y="370">mantle</text>
    <text x="700" y="370">crust</text>
    <text x="1000" y="370">surface0</text>
    <text x="1300" y="370">surface1</text>
  </g>
  <text x="80" y="920" font-family="monospace" font-size="26" fill="#7f849c"># 快捷键 t：Mocha ⇄ Latte</text>
