<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Catppuccin Mocha base -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="#1e1e2e"/>

  <!-- Document outline -->
  <path
    d="M18 8
       H40
       L51 19
       V53
       Q51 57 47 57
       H18
       Q14 57 14 53
       V12
       Q14 8 18 8
       Z"
    fill="none"
    stroke="#7f849c"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Folded corner -->
  <path
    d="M40 8 V19 H51"
    fill="none"
    stroke="#7f849c"
    stroke-width="5"
    stroke-linejoin="round"
  />

  <!-- Terminal prompt inside document -->
  <polyline
    points="21,19 27,25 21,31"
    fill="none"
    stroke="#a6e3a1"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Article lines -->
  <rect x="32" y="33" width="12" height="5" rx="1.5" fill="#cba6f7"/>
  <rect x="21" y="41" width="23" height="5" rx="1.5" fill="#cba6f7"/>
  <rect x="21" y="48" width="18" height="5" rx="1.5" fill="#cba6f7"/>
</svg>
